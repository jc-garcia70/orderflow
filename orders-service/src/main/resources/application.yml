server:
  port: 8083

spring:
  application:
    name: orders-service

  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: orders-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.orderflow.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3


jwt:
  secret: ${JWT_SECRET}

inventory-service:
  base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}
  connect-timeout: ${INVENTORY_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${INVENTORY_SERVICE_READ_TIMEOUT:3s}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  kafka-send-timeout-ms: ${OUTBOX_KAFKA_SEND_TIMEOUT_MS:10000}
  published-retention-days: ${OUTBOX_PUBLISHED_RETENTION_DAYS:30}
