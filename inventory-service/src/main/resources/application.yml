server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.orderflow.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3


jwt:
  secret: ${JWT_SECRET}

service-auth:
  secret: ${SERVICE_JWT_SECRET}
  issuer: ${SERVICE_AUTH_ISSUER:orders-service}
  audience: ${SERVICE_AUTH_AUDIENCE:inventory-service}

inventory:
  events:
    publisher: ${INVENTORY_EVENTS_PUBLISHER:outbox}
  retry:
    max-attempts: ${INVENTORY_RETRY_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${INVENTORY_RETRY_INITIAL_BACKOFF_MS:50}
    max-backoff-ms: ${INVENTORY_RETRY_MAX_BACKOFF_MS:500}

outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  kafka-send-timeout-ms: ${OUTBOX_KAFKA_SEND_TIMEOUT_MS:10000}
  published-retention-days: ${OUTBOX_PUBLISHED_RETENTION_DAYS:30}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
